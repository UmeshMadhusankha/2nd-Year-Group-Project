<!-- Header/Topbar Component -->
<header class="header">
  <div class="header-left">
    <label for="sidebar-toggle" class="sidebar-toggle">
      <i class="fas fa-bars"></i>
    </label>
    <div class="logo">
      <img src="../../assets/images/fixlanka.png" alt="FixLanka" class="logo-image">
    </div>
    <div class="page-info">
      <h1 class="page-title" id="page-title">Dashboard</h1>
      <p class="page-slogan" id="page-slogan">Welcome back, let's see what's happening today</p>
    </div>
  </div>

  <div class="header-right">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search requests, repairers, projects...">
    </div>

    <div class="notification-bell">
      <i class="fas fa-bell"></i>
      <span class="notification-badge">3</span>
    </div>

    <!-- Profile Dropdown -->
    <div class="profile-menu">
      <img src="#" alt="Admin" class="profile-avatar">
      <div class="dropdown-menu">
        <a href="#">My Profile</a>
        <a href="#">Settings</a>
        <a href="#">Logout</a>
      </div>
    </div>
  </div>
</header>

<script>
// Dynamic page header management
document.addEventListener('DOMContentLoaded', function() {
  // Get current page from URL
  const currentPath = window.location.pathname;
  const currentPage = currentPath.split('/').pop().replace('.html', '') || 'dashboard';
  
  // Update page header
  updatePageHeader(currentPage);
});

function updatePageHeader(currentPage) {
  const pageTitle = document.getElementById('page-title');
  const pageSlogan = document.getElementById('page-slogan');
  
  const pageInfo = {
    'dashboard': {
      title: 'Dashboard',
      slogan: 'Welcome back, let\'s see what\'s happening today'
    },
    'projects': {
      title: 'Projects',
      slogan: 'Manage and track your repair projects efficiently'
    },
    'workforce': {
      title: 'Workforce',
      slogan: 'Manage your team and freelancers all in one place'
    },
    'repair-requests': {
      title: 'Repair Requests',
      slogan: 'Handle customer requests and schedule repairs'
    },
    'requests': {
      title: 'Repair Requests',
      slogan: 'Handle customer requests and schedule repairs'
    },
    'support': {
      title: 'Support',
      slogan: 'Get help and manage customer support tickets'
    },
    'contracts': {
      title: 'Contracts',
      slogan: 'Manage agreements and legal documents'
    },
    'payments': {
      title: 'Payments',
      slogan: 'Track payments and financial transactions'
    },
    'settings': {
      title: 'Settings',
      slogan: 'Configure your account and system preferences'
    }
  };
  
  const info = pageInfo[currentPage] || pageInfo['dashboard'];
  
  if (pageTitle) {
    pageTitle.textContent = info.title;
  }
  
  if (pageSlogan) {
    pageSlogan.textContent = info.slogan;
  }
}
</script>
