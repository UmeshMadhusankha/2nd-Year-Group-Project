<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Notification Dropdown</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/2nd-Year-Group-Project/FixLanka/assets/css/common/variables.css">
    <link rel="stylesheet" href="/2nd-Year-Group-Project/FixLanka/assets/css/company/topbar.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .notification-bell {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: #0abab5;
            color: white;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }
        .notification-bell:hover {
            background: #099b96;
            transform: scale(1.1);
        }
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4444;
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            height: 18px;
            border: 2px solid white;
        }
        .console-output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .console-line {
            margin: 5px 0;
        }
        .console-error { color: #ff6b6b; }
        .console-success { color: #51cf66; }
        .console-info { color: #4dabf7; }
        .btn {
            padding: 10px 20px;
            background: #0abab5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        .btn:hover {
            background: #099b96;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔔 Notification Dropdown Test</h1>
        
        <div class="test-section">
            <h3>1. Click the Bell Icon Below:</h3>
            <div class="notification-bell" id="testBell">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" id="notificationCount">3</span>
            </div>
        </div>
        
        <div class="test-section">
            <h3>2. Check Console Output:</h3>
            <button class="btn" onclick="clearConsole()">Clear Console</button>
            <button class="btn" onclick="testManualOpen()">Manual Test</button>
            <div class="console-output" id="consoleOutput">
                <div class="console-line console-info">Console ready. Click the bell icon above...</div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>3. Checklist:</h3>
            <ul>
                <li id="check1">⏳ Waiting for bell click...</li>
                <li id="check2">⏳ Waiting for dropdown creation...</li>
                <li id="check3">⏳ Waiting for API call...</li>
                <li id="check4">⏳ Waiting for dropdown display...</li>
            </ul>
        </div>
    </div>

    <script>
        // Set company ID for testing
        window.CURRENT_COMPANY_ID = 1;
        
        // Intercept console.log for display
        const originalLog = console.log;
        const originalError = console.error;
        
        function addToConsole(message, type = 'info') {
            const output = document.getElementById('consoleOutput');
            const line = document.createElement('div');
            line.className = `console-line console-${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addToConsole(args.join(' '), 'info');
            updateChecklist(args[0]);
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addToConsole(args.join(' '), 'error');
        };
        
        function updateChecklist(message) {
            if (message.includes('Notification bell clicked')) {
                document.getElementById('check1').innerHTML = '✅ Bell clicked!';
            }
            if (message.includes('Creating notification dropdown')) {
                document.getElementById('check2').innerHTML = '✅ Dropdown created!';
            }
            if (message.includes('Fetching notifications')) {
                document.getElementById('check3').innerHTML = '✅ API called!';
            }
            if (message.includes('Dropdown appended')) {
                document.getElementById('check4').innerHTML = '✅ Dropdown displayed!';
            }
        }
        
        function clearConsole() {
            document.getElementById('consoleOutput').innerHTML = '<div class="console-line console-info">Console cleared.</div>';
        }
        
        function testManualOpen() {
            addToConsole('Manual test started...', 'success');
            if (typeof toggleNotificationDropdown === 'function') {
                toggleNotificationDropdown();
            } else {
                addToConsole('ERROR: toggleNotificationDropdown function not found!', 'error');
            }
        }
        
        // Log initial state
        addToConsole('Test page loaded', 'success');
        addToConsole('Company ID: ' + window.CURRENT_COMPANY_ID, 'info');
    </script>
    
    <!-- Load topbar JavaScript -->
    <script src="/2nd-Year-Group-Project/FixLanka/assets/javascript/company/topbar.js"></script>
    
    <script>
        // Initialize after topbar.js loads
        setTimeout(function() {
            addToConsole('Initializing topbar...', 'info');
            if (typeof initNotifications === 'function') {
                initNotifications();
                addToConsole('initNotifications() called', 'success');
            } else {
                addToConsole('ERROR: initNotifications function not found!', 'error');
            }
        }, 100);
    </script>
</body>
</html>
