<!DOCTYPE html>
<html>
<head>
    <title>Search Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { background: #f5f5f5; padding: 15px; margin: 15px 0; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #fff; padding: 10px; border: 1px solid #ddd; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 Search API Debug Tool</h1>
    
    <div class="test-section">
        <h2>Test Controls</h2>
        <button onclick="testSearch('kit', 'all')">Test: "kit" with "All"</button>
        <button onclick="testSearch('kit', 'projects')">Test: "kit" with "Projects"</button>
        <button onclick="testSearch('kit', 'requests')">Test: "kit" with "Requests"</button>
        <button onclick="testSearch('repair', 'all')">Test: "repair" with "All"</button>
    </div>
    
    <div class="test-section">
        <h2>Session Info</h2>
        <div id="sessionInfo">Loading...</div>
    </div>
    
    <div class="test-section">
        <h2>Last Test Result</h2>
        <div id="testResult"></div>
    </div>
    
    <div class="test-section">
        <h2>All Test Results</h2>
        <div id="allResults"></div>
    </div>

    <script>
        // Check session on load
        window.onload = async function() {
            try {
                const response = await fetch('/2nd-Year-Group-Project/FixLanka/debug_session.php');
                const data = await response.json();
                document.getElementById('sessionInfo').innerHTML = `
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('sessionInfo').innerHTML = `
                    <span class="error">❌ Error loading session: ${error.message}</span>
                `;
            }
        };

        async function testSearch(query, category) {
            const resultDiv = document.getElementById('testResult');
            const allResultsDiv = document.getElementById('allResults');
            
            resultDiv.innerHTML = `<p>🔄 Testing search for "${query}" with category "${category}"...</p>`;
            
            try {
                const startTime = performance.now();
                
                // Build URL
                const url = `/2nd-Year-Group-Project/FixLanka/api/global-search.php?q=${encodeURIComponent(query)}&category=${encodeURIComponent(category)}`;
                
                console.log('Calling:', url);
                
                // Make request
                const response = await fetch(url);
                const endTime = performance.now();
                
                // Get response
                const text = await response.text();
                console.log('Response text:', text);
                
                let data;
                try {
                    data = JSON.parse(text);
                } catch (parseError) {
                    resultDiv.innerHTML = `
                        <span class="error">❌ JSON Parse Error</span>
                        <p>HTTP Status: ${response.status}</p>
                        <p>Response was not valid JSON:</p>
                        <pre>${text}</pre>
                    `;
                    return;
                }
                
                // Display result
                const timeTaken = (endTime - startTime).toFixed(2);
                
                let html = `
                    <p><strong>Query:</strong> "${query}"</p>
                    <p><strong>Category:</strong> "${category}"</p>
                    <p><strong>HTTP Status:</strong> ${response.status}</p>
                    <p><strong>Time:</strong> ${timeTaken}ms</p>
                    <p><strong>Success:</strong> ${data.success ? '✅ Yes' : '❌ No'}</p>
                `;
                
                if (data.success) {
                    html += `<p><strong>Results Found:</strong> ${data.results.length}</p>`;
                    if (data.results.length > 0) {
                        html += '<h4>Results:</h4><ul>';
                        data.results.forEach(item => {
                            html += `<li><strong>${item.type}:</strong> ${item.title} - ${item.subtitle}</li>`;
                        });
                        html += '</ul>';
                    } else {
                        html += '<p class="error">⚠️ No results found</p>';
                    }
                } else {
                    html += `<p class="error"><strong>Error:</strong> ${data.message}</p>`;
                    if (data.error) {
                        html += `<p class="error"><strong>Details:</strong> ${data.error}</p>`;
                    }
                }
                
                html += '<h4>Full Response:</h4>';
                html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                
                resultDiv.innerHTML = html;
                
                // Add to all results
                const timestamp = new Date().toLocaleTimeString();
                allResultsDiv.innerHTML = `
                    <div style="border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 10px;">
                        <strong>[${timestamp}]</strong> "${query}" + "${category}" → 
                        ${data.success ? `✅ ${data.results.length} results` : `❌ ${data.message}`}
                    </div>
                ` + allResultsDiv.innerHTML;
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <span class="error">❌ Fetch Error: ${error.message}</span>
                `;
            }
        }
    </script>
</body>
</html>
